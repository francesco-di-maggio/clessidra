name: Feedback
description: What you played, what you heard, what you would change.
title: "Feedback: "
labels: [feedback]
body:
  - type: dropdown
    id: where
    attributes:
      label: Played on
      options:
        - Simple Touch
        - Browser
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Firmware release, for example v0.2.0. Leave empty for the browser.
  - type: textarea
    id: played
    attributes:
      label: What you played
      description: The controls you used and the sound going in.
    validations:
      required: true
  - type: textarea
    id: heard
    attributes:
      label: What you heard, and what you expected
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What you would change
